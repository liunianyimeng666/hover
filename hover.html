<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML + CSS 悬停上浮效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }

        .stage {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding: 56px 32px;
        }

        .cube {
            position: relative;
            width: 170px;
            height: 170px;
            transition: transform .3s ease, box-shadow .3s ease;
        }

        .cube::after {
            content: "hover";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: .08em;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .25);
            opacity: 0;
            transform: scale(.85);
            transition: opacity .28s ease, transform .28s ease;
        }

        .cube:hover {
            transform: translateY(-10px);
        }

        .cube:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        .c1 {
            border-radius: 5px;
            background: linear-gradient(135deg, #ff9a56, #ff5e62);
            box-shadow: 0 15px 38px rgba(255, 94, 98, .35);
        }
        .c1:hover {
            box-shadow: 0 0 38px rgba(255, 94, 98, .45);
        }

        .c2 {
            border-radius: 20px;
            background: linear-gradient(45deg, #3cca6e, #33d8bc);
            box-shadow: 0 15px 38px rgba(51, 216, 188, .3);
        }
        .c2:hover {
            box-shadow: 0 0 38px rgba(51, 216, 188, .4);
        }

        .c3 {
            border-radius: 40px;
            background: linear-gradient(180deg, #ab87a5, #726494);
            box-shadow: 0 15px 38px rgba(142, 118, 157, .32);
        }
        .c3:hover {
            box-shadow: 0 0 38px rgba(142, 118, 157, .42);
        }

        .c4 {
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                        #f6d365, #f8c46e 30%, #fab478 65%, #fbae7e);
            box-shadow: 0 15px 38px rgba(249, 196, 111, .3);
        }
        .c4:hover {
            box-shadow: 0 0 38px rgba(249, 196, 111, .4);
        }

        .c5 {
            border-radius: 12px;
            background: linear-gradient(135deg, #497f63, #4d6d81);
            box-shadow: 0 15px 38px rgba(74, 120, 113, .3);
        }
        .c5:hover {
            box-shadow: 0 0 38px rgba(74, 120, 113, .4);
        }

        .c6 {
            border-radius: 50%;
            background: radial-gradient(circle at 68% 30%,
                        #c198b9, #ab89b1 35%, #8a74a5 70%, #7b6899);
            box-shadow: 0 15px 38px rgba(138, 116, 165, .28);
        }
        .c6:hover {
            box-shadow: 0 0 38px rgba(138, 116, 165, .38);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
